name: Desktop Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DENO_VERSION: 2.9.4
  NODE_VERSION: 24
  PNPM_VERSION: 10.34.1

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v${{ env.DENO_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: Typecheck workspace
        run: pnpm typecheck
      - name: Check Deno desktop
        run: pnpm --filter @meow/desktop-deno check
      - name: Test Deno desktop
        run: pnpm --filter @meow/desktop-deno test
      - name: Test Control Agent
        run: pnpm --filter @metacubexd/agent test
      - name: Test dashboard
        run: pnpm --filter @metacubexd/ui test:unit

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: meow-linux-x64
            output: Meow.AppImage
          - target: x86_64-pc-windows-msvc
            artifact: meow-windows-x64
            output: Meow.msi
          - target: aarch64-apple-darwin
            artifact: meow-macos-arm64
            output: Meow.app
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v${{ env.DENO_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: Build desktop package
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if pnpm --filter @meow/desktop-deno build -- \
              --target ${{ matrix.target }}; then
              exit 0
            fi
            if [[ $attempt == 3 ]]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/deno/${{ matrix.target }}/${{ matrix.output }}
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: true

  windows-e2e:
    name: Windows installer E2E
    needs: build
    runs-on: windows-2025
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: meow-windows-x64
          path: artifact
      - name: Install and launch Meow
        shell: pwsh
        run: |
          $msi = (Resolve-Path 'artifact/Meow.msi').Path
          $installer = Start-Process msiexec.exe -ArgumentList '/i', $msi, '/qn', '/norestart' -Wait -PassThru
          if ($installer.ExitCode -ne 0) {
            throw "MSI installation failed with exit code $($installer.ExitCode)"
          }

          $app = Join-Path $env:ProgramFiles 'Meow/Meow.exe'
          if (-not (Test-Path $app)) {
            throw "Installed executable not found at $app"
          }
          $shortcut = Join-Path $env:ProgramData 'Microsoft/Windows/Start Menu/Programs/Meow.lnk'
          if (-not (Test-Path $shortcut)) {
            throw "Start Menu shortcut not found at $shortcut"
          }

          $stdout = Join-Path $env:RUNNER_TEMP 'meow-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'meow-stderr.log'
          $process = Start-Process $app -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $deadline = (Get-Date).AddSeconds(30)
          do {
            Start-Sleep -Seconds 1
            if ($process.HasExited) { break }
            $logs = @($stdout, $stderr) |
              Where-Object { Test-Path $_ } |
              ForEach-Object { Get-Content $_ -Raw }
            $address = [regex]::Match(($logs -join "`n"), 'Listening on (http://127\.0\.0\.1:\d+/)')
          } while (-not $address.Success -and (Get-Date) -lt $deadline)

          if ($process.HasExited -or -not $address.Success) {
            $logs | ForEach-Object { Write-Host $_ }
            if ($process.HasExited) { throw "Meow exited during startup with code $($process.ExitCode)" }
            throw 'Meow did not start its loopback server within 30 seconds'
          }

          $baseUrl = $address.Groups[1].Value
          $dashboard = Invoke-WebRequest $baseUrl -UseBasicParsing
          if ($dashboard.StatusCode -ne 200 -or $dashboard.Content -notmatch '<div id="__nuxt">') {
            throw 'Meow did not serve the dashboard shell'
          }
          $bridge = Invoke-WebRequest "${baseUrl}config.js" -UseBasicParsing
          if ($bridge.StatusCode -ne 200 -or $bridge.Content -notmatch 'isDesktop: true') {
            throw 'Meow did not serve the Desktop bridge'
          }
      - name: Clean up installation
        if: always()
        shell: pwsh
        run: |
          Get-Process Meow, mihomo -ErrorAction SilentlyContinue | Stop-Process -Force
          $msi = (Resolve-Path 'artifact/Meow.msi').Path
          $uninstaller = Start-Process msiexec.exe -ArgumentList '/x', $msi, '/qn', '/norestart' -Wait -PassThru
          if ($uninstaller.ExitCode -ne 0) {
            throw "MSI uninstall failed with exit code $($uninstaller.ExitCode)"
          }
